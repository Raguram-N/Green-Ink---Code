server:
  port: ${PORT:8787}
  forward-headers-strategy: framework

spring:
  application:
    name: green-ink-api
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info

greenink:
  security:
    jwt-secret: ${GREEN_INK_JWT_SECRET:}
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
    secure-cookies: ${GREEN_INK_SECURE_COOKIES:true}
  auth:
    mode: ${GREEN_INK_AUTH_MODE:not-configured}
    dev-otp: ${GREEN_INK_DEV_OTP:1234}
    expose-dev-otp: false
    otp-ttl: PT5M
    resend-after: PT45S
    max-attempts: 5
    admin-identifiers: ${GREEN_INK_ADMIN_IDENTIFIERS:}
  billing:
    mode: ${GREEN_INK_BILLING_MODE:not-configured}
  cors:
    allowed-origins: ${GREEN_INK_ALLOWED_ORIGINS:http://localhost:5500,http://localhost:5173,http://127.0.0.1:5500}
