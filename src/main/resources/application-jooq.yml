greenink:
  security:
    jwt-secret: dev-only-green-ink-jwt-secret-change-before-production-0123456789abcdef
    secure-cookies: false
  auth:
    mode: dev
    expose-dev-otp: true
    admin-identifiers: admin@greenink.local
  billing:
    mode: demo

spring:
  datasource:
    url: ${GREEN_INK_DB_URL:jdbc:postgresql://localhost:5432/green_ink}
    username: ${GREEN_INK_DB_USERNAME:postgres}
    password: ${GREEN_INK_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jooq:
    sql-dialect: POSTGRES